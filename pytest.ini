[pytest]
# Put the project root on sys.path so tests can import the first-party
# packages (configs, analysis, tokenizer, ...).
#
# Without this, `python -m pytest` and bare `pytest` disagree: the -m form
# prepends the current directory to sys.path, so it passes, while bare
# `pytest` does not, so it fails collection with ModuleNotFoundError. CI runs
# the bare form. Setting it here makes both invocations behave identically.
pythonpath = .

testpaths = tests
